[build]
  base = "ui-preview"
  publish = ".next"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  API_UPSTREAM_URL = "https://unisynapse-backend.onrender.com"
  NEXT_PUBLIC_API_URL = "https://unisynapse-backend.onrender.com"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/dant-ky"
  to = "/dang-ky"
  status = 301
  force = true

[[redirects]]
  from = "/dant-nhap"
  to = "/dang-nhap"
  status = 301
  force = true

[[redirects]]
  from = "https://unihackfest-web.netlify.app/*"
  to = "https://unisynapse.netlify.app/:splat"
  status = 301
  force = true

