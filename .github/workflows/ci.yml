name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      ALLOW_SQLITE: "1"
      COOKIE_SECURE: "0"
      MOCK_MODE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run backend tests
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  configuration:
    name: Fail-closed configuration tests
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      ALLOW_SQLITE: "1"
      COOKIE_SECURE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run configuration and security tests
        run: python -m pytest backend/tests/test_database_config.py backend/tests/test_security.py -q

  staging-postgres:
    name: PostgreSQL staging contract (opt-in)
    if: ${{ vars.RUN_STAGING_POSTGRES == 'true' }}
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      ENVIRONMENT: staging
      ALLOW_SQLITE: "0"
      COOKIE_SECURE: "1"
      SOLANA_SUBMISSION_ENABLED: "0"
    steps:
      - name: Require staging database secret
        shell: bash
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "RUN_STAGING_POSTGRES=true requires TEST_DATABASE_URL in the repository secret store"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Validate PostgreSQL contract
        run: python -m pytest backend/tests/test_postgres_integration.py -q

  secret-safety:
    name: Secret/config safety scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject committed private key material
        shell: bash
        run: |
          if git grep -n -I -E 'BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY|SOLANA_AUTHORITY_SECRET_REF[[:space:]]*=[[:space:]]*[^<[:space:]]' -- . ':!docs/operations.md' ':!docs/release-checklist.md' ':!docs/incident-runbook.md' ':!backend/core/config.py'; then
            echo "Potential secret material found in tracked files"
            exit 1
          fi
      - name: Check tracked env files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env.example$'; then
            echo "Tracked environment file detected"
            exit 1
          fi
